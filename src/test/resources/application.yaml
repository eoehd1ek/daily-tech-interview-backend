spring:
  application:
    name: tech
  profiles:
    active: test
  datasource:
    url: jdbc:tc:postgresql:18.6-alpine:///tech_test?TC_DAEMON=true
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: tech
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  admin:
    login-id: integration-admin
    password: test-only-password
